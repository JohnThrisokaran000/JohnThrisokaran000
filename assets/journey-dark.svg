<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-label="Education: ~2015 Thakur Intl. School, ICSE · 1st–4th; 2016–22 Don Bosco High School, SSC · 5th–10th; 2023–24 Narayana Jr. College, HSC Science; 2025–now Fr. CRCE, Bandra, B.Tech Computer Engg.">
  <title>Education timeline</title>
  <defs>
    <linearGradient id="tl" x1="0" x2="1"><stop offset="0" stop-color="#00d9ff" stop-opacity="0"/><stop offset=".12" stop-color="#00d9ff"/><stop offset=".88" stop-color="#00d9ff"/><stop offset="1" stop-color="#00d9ff" stop-opacity="0"/></linearGradient>
    <filter id="tg" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
    .line{stroke-dasharray:880;stroke-dashoffset:880;animation:draw 1.6s cubic-bezier(.22,.8,.3,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .n{opacity:0;animation:up .7s cubic-bezier(.22,.8,.3,1) forwards}
    @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out 1.6s infinite}
    @keyframes pulse{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.line{stroke-dashoffset:0}.n{opacity:1}}
  </style>
  <line class="line" x1="10" y1="96" x2="870" y2="96" stroke="url(#tl)" stroke-width="3"/>
  <g class="n" style="animation-delay:0.00s">
      <text x="100" y="66" text-anchor="middle" font-size="26" font-weight="900" letter-spacing="-1" fill="#00d9ff" filter="url(#tg)">~2015</text>
      <circle cx="100" cy="96" r="7" fill="#000000" stroke="#00d9ff" stroke-width="3"/>
      
      <text x="100" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Thakur Intl. School</text>
      <text x="100" y="158" text-anchor="middle" font-size="14" fill="#888888">ICSE · 1st–4th</text>
    </g><g class="n" style="animation-delay:0.35s">
      <text x="326.66666666666663" y="66" text-anchor="middle" font-size="26" font-weight="900" letter-spacing="-1" fill="#00d9ff" filter="url(#tg)">2016–22</text>
      <circle cx="326.66666666666663" cy="96" r="7" fill="#000000" stroke="#00d9ff" stroke-width="3"/>
      
      <text x="326.66666666666663" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Don Bosco High School</text>
      <text x="326.66666666666663" y="158" text-anchor="middle" font-size="14" fill="#888888">SSC · 5th–10th</text>
    </g><g class="n" style="animation-delay:0.70s">
      <text x="553.3333333333333" y="66" text-anchor="middle" font-size="26" font-weight="900" letter-spacing="-1" fill="#00d9ff" filter="url(#tg)">2023–24</text>
      <circle cx="553.3333333333333" cy="96" r="7" fill="#000000" stroke="#00d9ff" stroke-width="3"/>
      
      <text x="553.3333333333333" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Narayana Jr. College</text>
      <text x="553.3333333333333" y="158" text-anchor="middle" font-size="14" fill="#888888">HSC Science</text>
    </g><g class="n" style="animation-delay:1.05s">
      <text x="780" y="66" text-anchor="middle" font-size="26" font-weight="900" letter-spacing="-1" fill="#00d9ff" filter="url(#tg)">2025–now</text>
      <circle cx="780" cy="96" r="9" fill="#00d9ff" stroke="#00d9ff" stroke-width="3"/>
      <circle class="pulse" cx="780" cy="96" r="9" fill="none" stroke="#00d9ff" stroke-width="2"/>
      <text x="780" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Fr. CRCE, Bandra</text>
      <text x="780" y="158" text-anchor="middle" font-size="14" fill="#888888">B.Tech Computer Engg.</text>
    </g>
</svg>
