<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="John Thrisokaran, Full Stack Developer">
  <title>John Thrisokaran, Full Stack Developer</title>
  <defs>
    <radialGradient id="halo" cx="0.18" cy="0.5" r="0.55"><stop offset="0" stop-color="#00d9ff" stop-opacity=".16"/><stop offset="1" stop-color="#00d9ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#00d9ff"/><stop offset="1" stop-color="#00a8cc"/></linearGradient>
    <linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#00d9ff"/><stop offset="1" stop-color="#00d9ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="fadeR" gradientUnits="userSpaceOnUse" x1="660" x2="900"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="stageMask"><rect x="0" y="0" width="1200" height="340" fill="url(#fadeR)"/></mask>
    <linearGradient id="refl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="reflMask"><rect x="-400" y="0" width="1400" height="200" fill="url(#refl)"/></mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="stage"><rect x="640" y="0" width="560" height="340"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
    .type{font-size:30px;font-weight:600;fill:#ffffff}
    .caret{animation:blink .7s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .cube{fill:#03e9f4}
    .belt{animation:belt 1.5s ease-in-out infinite}
    @keyframes belt{to{transform:translateX(-56px)}}
    .roll{transform-box:fill-box;transform-origin:100% 100%;animation:roll 1.5s ease-in-out infinite}
    @keyframes roll{0%{transform:rotate(0)}60%,70%,80%,100%{transform:rotate(90deg)}65%{transform:rotate(85deg)}75%{transform:rotate(87.5deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.p0{opacity:1!important}.type{mask:none!important}.caret{display:none}}
  </style>
  <rect width="1200" height="340" fill="#000"/>
  <rect width="1200" height="340" fill="url(#halo)"/>

  <g clip-path="url(#stage)" mask="url(#stageMask)">
    <g transform="translate(860 230) rotate(-35)">
      <g filter="url(#glow)"><g class="belt"><rect class="cube roll" x="0" y="0" width="52" height="52" rx="12"/><rect class="cube roll" x="56" y="0" width="52" height="52" rx="12"/><rect class="cube roll" x="112" y="0" width="52" height="52" rx="12"/><rect class="cube roll" x="168" y="0" width="52" height="52" rx="12"/><rect class="cube roll" x="224" y="0" width="52" height="52" rx="12"/><rect class="cube roll" x="280" y="0" width="52" height="52" rx="12"/><rect class="cube roll" x="336" y="0" width="52" height="52" rx="12"/><rect class="cube roll" x="392" y="0" width="52" height="52" rx="12"/><rect class="cube roll" x="448" y="0" width="52" height="52" rx="12"/></g></g>
      <g transform="translate(0 106) scale(1 -1)" mask="url(#reflMask)" opacity=".9"><g class="belt"><rect class="cube roll" x="0" y="0" width="52" height="52" rx="12"/><rect class="cube roll" x="56" y="0" width="52" height="52" rx="12"/><rect class="cube roll" x="112" y="0" width="52" height="52" rx="12"/><rect class="cube roll" x="168" y="0" width="52" height="52" rx="12"/><rect class="cube roll" x="224" y="0" width="52" height="52" rx="12"/><rect class="cube roll" x="280" y="0" width="52" height="52" rx="12"/><rect class="cube roll" x="336" y="0" width="52" height="52" rx="12"/><rect class="cube roll" x="392" y="0" width="52" height="52" rx="12"/><rect class="cube roll" x="448" y="0" width="52" height="52" rx="12"/></g></g>
    </g>
  </g>

  <g transform="translate(64 0)">
    <text x="0" y="96" font-size="20" font-weight="600" letter-spacing="4" fill="#00d9ff">HI, I'M</text>
    <text x="-3" y="166" font-size="64" font-weight="800" fill="url(#name)">John Thrisokaran</text>
    <text x="0" y="222" class="type" fill="#ffffff">I'm a</text>
    <g transform="translate(84 222)">
    <style>
      @keyframes on0{0%,0.00%{opacity:0}0.01%,25.00%{opacity:1}25.01%,100%{opacity:0}}
      @keyframes ty0{0%,0.00%{transform:translateX(0)}8.59%,20.31%{transform:translateX(295px)}24.22%,100%{transform:translateX(0)}}
      .p0{opacity:0;animation:on0 12.8s linear infinite}
      .c0{animation:ty0 12.8s steps(20) infinite}
    </style>
    <mask id="m0" maskUnits="userSpaceOnUse" x="-10" y="-40" width="355" height="60"><rect class="c0 reveal" x="-295" y="-40" width="295" height="60" fill="#fff"/></mask>
    <g class="p0">
      <text x="0" y="0" class="type" mask="url(#m0)">Full Stack Developer</text>
      <rect class="c0 caret" x="0" y="-29" width="3" height="36" fill="#00d9ff"/>
    </g>
    <style>
      @keyframes on1{0%,25.00%{opacity:0}25.01%,50.00%{opacity:1}50.01%,100%{opacity:0}}
      @keyframes ty1{0%,25.00%{transform:translateX(0)}33.59%,45.31%{transform:translateX(230px)}49.22%,100%{transform:translateX(0)}}
      .p1{opacity:0;animation:on1 12.8s linear infinite}
      .c1{animation:ty1 12.8s steps(14) infinite}
    </style>
    <mask id="m1" maskUnits="userSpaceOnUse" x="-10" y="-40" width="290" height="60"><rect class="c1 reveal" x="-230" y="-40" width="230" height="60" fill="#fff"/></mask>
    <g class="p1">
      <text x="0" y="0" class="type" mask="url(#m1)">UI/UX Designer</text>
      <rect class="c1 caret" x="0" y="-29" width="3" height="36" fill="#00d9ff"/>
    </g>
    <style>
      @keyframes on2{0%,50.00%{opacity:0}50.01%,75.00%{opacity:1}75.01%,100%{opacity:0}}
      @keyframes ty2{0%,50.00%{transform:translateX(0)}58.59%,70.31%{transform:translateX(222px)}74.22%,100%{transform:translateX(0)}}
      .p2{opacity:0;animation:on2 12.8s linear infinite}
      .c2{animation:ty2 12.8s steps(14) infinite}
    </style>
    <mask id="m2" maskUnits="userSpaceOnUse" x="-10" y="-40" width="282" height="60"><rect class="c2 reveal" x="-222" y="-40" width="222" height="60" fill="#fff"/></mask>
    <g class="p2">
      <text x="0" y="0" class="type" mask="url(#m2)">Problem Solver</text>
      <rect class="c2 caret" x="0" y="-29" width="3" height="36" fill="#00d9ff"/>
    </g>
    <style>
      @keyframes on3{0%,75.00%{opacity:0}75.01%,100.00%{opacity:1}100.01%,100%{opacity:0}}
      @keyframes ty3{0%,75.00%{transform:translateX(0)}83.59%,95.31%{transform:translateX(236px)}99.22%,100%{transform:translateX(0)}}
      .p3{opacity:0;animation:on3 12.8s linear infinite}
      .c3{animation:ty3 12.8s steps(15) infinite}
    </style>
    <mask id="m3" maskUnits="userSpaceOnUse" x="-10" y="-40" width="296" height="60"><rect class="c3 reveal" x="-236" y="-40" width="236" height="60" fill="#fff"/></mask>
    <g class="p3">
      <text x="0" y="0" class="type" mask="url(#m3)">Code Enthusiast</text>
      <rect class="c3 caret" x="0" y="-29" width="3" height="36" fill="#00d9ff"/>
    </g></g>
    <rect x="0" y="252" width="140" height="3" fill="url(#rule)"/>
    <text x="0" y="290" font-size="18" fill="#888888">B.Tech Computer Engineering · Fr. CRCE, Mumbai</text>
  </g>
</svg>
